# ci.yml: the continuous integration workflow for Task Tracker
name: CI
 
# Triggers: when the workflow runs
on:
  push:
    branches: [main]        # every push to main
  pull_request:
    branches: [main]        # every pull request that targets main
  workflow_dispatch:        # a Run workflow button on the Actions tab
 
jobs:
  test:
    # The job name shows the Python version, for example: test (Python 3.12)
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Matrix: run this job once for each Python version, at the same time
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out the code
        uses: actions/checkout@v5
 
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip        # keep downloaded packages between runs
 
      - name: Install the dependencies
        run: pip install -r requirements.txt
 
      - name: Lint with ruff
        run: ruff check .
 
      # The minimum coverage now comes from the repository variable COVERAGE_MIN
      - name: Run the tests with a coverage gate
        run: |
          python -m pytest -v --cov=app --cov-report=term-missing \
            --cov-fail-under=${{ vars.COVERAGE_MIN }}
 
      # A secret is passed to a step as an environment variable
      # GitHub hides its value in the log; never print a real secret
      - name: Show how GitHub protects a secret
        env:
          DEMO_TOKEN: ${{ secrets.DEMO_TOKEN }}
        run: echo "The token has ${#DEMO_TOKEN} characters and is $DEMO_TOKEN"
