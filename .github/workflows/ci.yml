# ci.yml: the continuous integration workflow for Task Tracker
name: CI
 
# Triggers: when the workflow runs
on:
  push:
    branches: [main]        # every push to main
  pull_request:
    branches: [main]        # every pull request that targets main
  workflow_dispatch:        # a Run workflow button on the Actions tab
 
jobs:
  test:
    # The job name shows the Python version, for example: test (Python 3.12)
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Matrix: run this job once for each Python version, at the same time
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out the code
        uses: actions/checkout@v5
 
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip        # keep downloaded packages between runs
 
      - name: Install the dependencies
        run: pip install -r requirements.txt
 
      - name: Lint with ruff
        run: ruff check .
 
      # The minimum coverage now comes from the repository variable COVERAGE_MIN
      - name: Run the tests with a coverage gate
        run: |
          python -m pytest -v --cov=app --cov-report=term-missing \
            --cov-fail-under=${{ vars.COVERAGE_MIN }}
 
      # A secret is passed to a step as an environment variable
      # GitHub hides its value in the log; never print a real secret
      - name: Show how GitHub protects a secret
        env:
          DEMO_TOKEN: ${{ secrets.DEMO_TOKEN }}
        run: echo "The token has ${#DEMO_TOKEN} characters and is $DEMO_TOKEN"
 
  package:
    needs: test             # runs only if every test job passed
    runs-on: ubuntu-latest
    # Make the artifact name available to later jobs
    outputs:
      artifact: ${{ steps.build.outputs.artifact }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v5
 
      # Stage 3 from Lab 6: build the versioned artifact once
      - name: Build the artifact and its checksum
        id: build
        run: |
          VERSION=$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' app.py)
          ARTIFACT="task-tracker-${VERSION}-${GITHUB_SHA::7}.tar.gz"
          mkdir -p dist
          tar -czf "dist/$ARTIFACT" app.py
          (cd dist && sha256sum "$ARTIFACT" > "$ARTIFACT.sha256")
          ls -l dist
          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"
 
      # Stage 4: store the artifact with this workflow run
      - name: Upload the artifact
        uses: actions/upload-artifact@v5
        with:
          name: task-tracker
          path: dist/
          retention-days: 7
 
  smoke-test:
    needs: package          # runs only if the package job passed
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
 
      # Download the exact artifact that the package job built
      - name: Download the artifact
        uses: actions/download-artifact@v5
        with:
          name: task-tracker
          path: dist
 
      # Stage 5 from Lab 6: check, run, and smoke test the artifact
      - name: Check, run, and smoke test the artifact
        env:
          ARTIFACT: ${{ needs.package.outputs.artifact }}
        run: |
          cd dist
          sha256sum -c "$ARTIFACT.sha256"
          tar -xzf "$ARTIFACT"
          python app.py &
          sleep 2
          curl -s localhost:8080/health
          echo
          curl -s localhost:8080/health | grep -q '"status": "ok"'
          echo "Smoke test passed: $ARTIFACT is a release candidate"
